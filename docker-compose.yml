services:
  searchlab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: searchlab-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: searchlab-db
    environment:
      POSTGRES_DB: ${DB_NAME:-searchlab}
      POSTGRES_USER: ${DB_USER:-searchlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-searchlab}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-searchlab} -d ${DB_NAME:-searchlab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: searchlab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
